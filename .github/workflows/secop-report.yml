# Place this at: .github/workflows/secop-report.yml

name: SECOP Weekly Report

on:
  schedule:
    # 08:00 America/Bogota (UTC-5) every Monday = 13:00 UTC
    - cron: '0 13 * * 1'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run SECOP report
        run: node scripts/secop-report.mjs
        env:
          SECOP_APP_TOKEN: ${{ secrets.SECOP_APP_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
